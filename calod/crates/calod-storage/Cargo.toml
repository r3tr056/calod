[package]
name = "calod-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
calod-core = { path = "../calod-core" }
async-trait = "0.1.86"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.13.1", features = ["v4"] }
crc32c = "0.6.8"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.132"
tracing = "0.1.44"

[dev-dependencies]
rand = "0.9"
