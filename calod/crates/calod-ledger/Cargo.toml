[package]
name = "calod-ledger"
version = "0.1.0"
edition = "2021"

[dependencies]
calod-core = { path = "../calod-core" }
calod-storage = { path = "../calod-storage" }
dashmap = "6.1.0"
crc32c = "0.6.8"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.132"
sha2 = "0.10.8"
thiserror = "1.0.64"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.41"
uuid = { version = "1.13.1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
rand = "0.9"
