[package]
name = "calod-core"
version = "0.1.0"
edition = "2021"

[dependencies]
ahash = "0.8.11"
argon2 = "0.5.3"
async-trait = "0.1.86"
bincode = "1.3.3"
bytes = "1.9.0"
crc32c = "0.6.8"
dashmap = { version = "6.1.0", features = ["serde"] }
lru = "0.15.0"
num_cpus = "1.16.0"
rand = "0.9.0"
serde = { version = "1.0.215", features = ["derive"] }
serde_bytes = "0.11.15"
serde_derive = "1.0.215"
serde_json = "1.0.132"
serde_with = "3.12.0"
thiserror = "1.0.64"
tokio = { version = "1", features = ["full"] }
