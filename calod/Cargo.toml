[package]
name = "calod"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10.3"
ahash = "0.8.11"
async-std = "1.13.0"
async-trait = "0.1.86"
atomic_refcell = "0.1.13"
base64 = "0.22.1"
bb8 = "0.9.0"
bincode = "1.3.3"
blake3 = "1.6.1"
bytes = "1.9.0"
chrono = { version = "0.4.38", features = ["serde"] }
clap = { version = "4.5.32", features = ["derive"] }
crossbeam = "0.8.4"
crossbeam-skiplist = "0.1.3"
dashmap = { version = "6.1.0", features = ["serde"] }
haphazard = "0.1.8"
ibverbs = "0.9.2"
jsonpath-plus = "0.1.9"
lru = "0.15.0"
memchr = "2.7.4"
mimalloc = { version = "0.1.43", features = ["secure"] }
num_cpus = "1.16.0"
once_cell = "1.20.2"
rand = "0.9.0"
rayon = "1.10.0"
rng = "0.1.0"
serde = { version = "1.0.215", features = ["derive"] }
serde_bytes = "0.11.15"
serde_derive = "1.0.215"
serde_json = "1.0.132"
serde_with = "3.12.0"
serial_test = "3.1.1"
simd-json = "0.14.3"
socket2 = "0.5.8"
thiserror = "1.0.64"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
twox-hash = "2.1.0"
uuid = { version = "1.13.1", features = ["v4"] }
wide = "0.7.33"

[features]
default = ["rdma", "tiered-memory"]
rdma = []
tiered-memory = []

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
panic = "abort"
