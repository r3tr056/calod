[package]
name = "calod"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "crates/calod-api",
    "crates/calod-core",
    "crates/calod-ledger",
    "crates/calod-resp",
    "crates/calod-storage",
]
default-members = [
    ".",
    "crates/calod-api",
    "crates/calod-core",
    "crates/calod-ledger",
    "crates/calod-resp",
    "crates/calod-storage",
]

[dependencies]
calod-api = { path = "crates/calod-api" }
calod-core = { path = "crates/calod-core" }
calod-resp = { path = "crates/calod-resp" }
calod-storage = { path = "crates/calod-storage" }
ahash = "0.8.11"
clap = { version = "4.5.32", features = ["derive"] }
dashmap = { version = "6.1.0", features = ["serde"] }
mimalloc = { version = "0.1.43", features = ["secure"] }
socket2 = "0.5.8"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "0.8"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
uuid = { version = "1.13.1", features = ["v4"] }

[features]
default = []

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
panic = "abort"

[dev-dependencies]
redis = { version = "0.27.6", features = ["tokio-comp", "aio"] }
futures-util = "0.3"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde_json = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
