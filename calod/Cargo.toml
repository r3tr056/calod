[package]
name = "calod"
version = "0.1.0"
edition = "2021"

[dependencies]
ahash = "0.8.11"
async-trait = "0.1.86"
argon2 = "0.5.3"
bb8 = "0.9.0"
bincode = "1.3.3"
bytes = "1.9.0"
chrono = { version = "0.4.38", features = ["serde"] }
clap = { version = "4.5.32", features = ["derive"] }
dashmap = { version = "6.1.0", features = ["serde"] }
ibverbs = { version = "0.9.2", optional = true }
lru = "0.15.0"
memchr = "2.7.4"
mimalloc = { version = "0.1.43", features = ["secure"] }
mlua = { version = "0.10", features = ["lua51", "vendored"] }
num_cpus = "1.16.0"
rand = "0.9.0"
serde = { version = "1.0.215", features = ["derive"] }
serde_bytes = "0.11.15"
serde_derive = "1.0.215"
serde_json = "1.0.132"
serde_with = "3.12.0"
sha1_smol = "1.0"
socket2 = "0.5.8"
thiserror = "1.0.64"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
twox-hash = "2.1.0"
uuid = { version = "1.13.1", features = ["v4"] }
wide = "0.7.33"

[features]
default = []
rdma = ["dep:ibverbs"]
tiered-memory = []

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
panic = "abort"

[dev-dependencies]
redis = { version = "0.27.6", features = ["tokio-comp", "aio"] }
futures-util = "0.3"
