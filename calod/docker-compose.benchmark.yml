# Benchmark topology for scripts/benchmark/run_benchmarks.sh.
#
# Every server under test is pinned to the SAME cpuset (SERVER_CPUSET,
# N_CORES wide) so core parity is real; the memtier client is pinned to a
# disjoint cpuset (CLIENT_CPUSET) of equal width. Persistence is off for all
# three servers. Host-level hygiene (vm.overcommit_memory=1, THP, somaxconn)
# cannot be set from compose and is checked/documented by run_benchmarks.sh.
services:
  calod:
    build:
      context: .
      dockerfile: Dockerfile
    image: calod-benchmark:local
    command: ["--address", "0.0.0.0", "--port", "6379", "--reuse-address"]
    # calod persistence is off by default (enable_aof: false in
    # src/store/config.rs); no flag needed.
    cpuset: "${SERVER_CPUSET:-0-3}"
    mem_limit: ${CALOD_SERVER_MEM_LIMIT:-6g}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    sysctls:
      net.core.somaxconn: "65535"
    healthcheck:
      test: ["CMD-SHELL", "printf '*1\\r\\n$4\\r\\nPING\\r\\n' | nc -w 1 127.0.0.1 6379 | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: "no"

  redis:
    image: redis:7.4.2-bookworm
    command:
      - "redis-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--protected-mode"
      - "no"
      # io-threads N-1: the main thread counts separately, so total = N_CORES.
      - "--io-threads"
      - "${IO_THREADS:-3}"
      - "--io-threads-do-reads"
      - "yes"
    cpuset: "${SERVER_CPUSET:-0-3}"
    mem_limit: ${CALOD_SERVER_MEM_LIMIT:-6g}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    sysctls:
      net.core.somaxconn: "65535"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: "no"

  valkey:
    image: valkey/valkey:8.0.2-bookworm
    command:
      - "valkey-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--protected-mode"
      - "no"
      - "--io-threads"
      - "${IO_THREADS:-3}"
      - "--io-threads-do-reads"
      - "yes"
    cpuset: "${SERVER_CPUSET:-0-3}"
    mem_limit: ${CALOD_SERVER_MEM_LIMIT:-6g}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    sysctls:
      net.core.somaxconn: "65535"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: "no"

  # Client. Started ad-hoc via `docker compose run --rm memtier ...` from
  # run_benchmarks.sh; not part of `up`.
  memtier:
    image: redislabs/memtier_benchmark:latest
    cpuset: "${CLIENT_CPUSET:-4-7}"
    mem_limit: ${CALOD_RUNNER_MEM_LIMIT:-4g}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    sysctls:
      net.core.somaxconn: "65535"
    volumes:
      - ${BENCH_RESULTS_DIR:-./benchmark-results}:/results
    profiles: ["client"]
