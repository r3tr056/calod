name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: calod

jobs:
  fmt-clippy:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: calod
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: calod
      - name: cargo test
        run: cargo test --all-targets

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t calod:ci calod

  python-sdk:
    name: python SDK tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK with dev extras
        run: pip install -e "calod/sdk/python[dev]"
      - name: Run SDK tests
        run: pytest calod/sdk/python/tests -q

  openapi-lint:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint openapi.yaml
        run: npx --yes @redocly/cli@latest lint calod/docs/openapi.yaml
